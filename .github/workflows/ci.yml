# ═══════════════════════════════════════════════════════════════
#  PanelOS — CI workflow
#  Runs on: every push to main + every Pull Request targeting main.
#  Backend lint + frontend build run on every push and PR. The backend test
#  suite (tests.yml) runs on pull requests here; on a push to main it runs as
#  the first job of deploy.yml, which waits for it before shipping anything.
# ═══════════════════════════════════════════════════════════════

name: CI

# ── When this workflow runs ──────────────────────────────────────
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Allow manual triggering from the Actions tab too (useful for retries)
  workflow_dispatch:

# Cancel earlier in-flight runs on the SAME PR when a new push lands.
# Saves CI minutes and avoids confusing "old check still running" UI.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────
  # Job 1: Backend — PHP syntax + composer install
  # ─────────────────────────────────────────────────────────────
  backend:
    name: Backend (PHP 8.3)
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring, bcmath, intl, gd, exif, zip, opcache, pcntl
          coverage: none
          tools: composer:v2

      # Composer is slow if it has to download everything fresh. Cache the
      # vendor/ folder + composer cache keyed on the lockfile content. When
      # composer.lock changes, the cache key changes → fresh install.
      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: |
            backend/vendor
            ~/.composer/cache
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install Composer dependencies
        working-directory: backend
        run: composer install --prefer-dist --no-progress --no-interaction

      # PHP -l does a syntax-only check (no execution) on each file.
      # Catches missing semicolons, mismatched braces, typos that would
      # only surface in production. ~3 seconds for the whole codebase.
      - name: PHP syntax lint
        working-directory: backend
        run: |
          find app routes config database -type f -name "*.php" \
            -exec php -l {} \; \
          | grep -v "No syntax errors detected" || echo "All PHP files have valid syntax"

  # ─────────────────────────────────────────────────────────────
  # Job: Backend tests — pull requests only (a push to main is tested by deploy.yml)
  # ─────────────────────────────────────────────────────────────
  tests:
    name: Backend tests
    if: github.event_name != 'push'
    uses: ./.github/workflows/tests.yml

  # ─────────────────────────────────────────────────────────────
  # Job 2: Frontend — verify it compiles cleanly
  # ─────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (Node 20)
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # Cache node_modules indirectly via npm's cache — keyed on lockfile.
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Unit tests
        working-directory: frontend
        run: npm test

      - name: Production build
        working-directory: frontend
        run: npm run build

      # Build artifacts sanity check — fails CI loudly if Vite silently
      # produced nothing (which would also break the Docker build later).
      - name: Verify dist output
        working-directory: frontend
        run: |
          test -f dist/index.html || (echo "::error::dist/index.html missing — Vite build produced no output" && exit 1)
          echo "Built artifacts:"
          ls -la dist/
          du -sh dist/

  # ─────────────────────────────────────────────────────────────
  # Job 3: Docker images build cleanly (catches Dockerfile errors)
  # ─────────────────────────────────────────────────────────────
  docker-build:
    name: Docker Images
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Only build images if the source code passed lint/build first — no
    # point burning 5 minutes on a docker build for code that won't compile.
    needs: [backend, frontend]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # `push: false` = build only, don't publish to a registry yet.
      # That's Phase 10's job. Here we just verify the Dockerfile is valid.
      # GHA cache speeds up rebuilds across runs of the same workflow.
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: panelos-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: panelos-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
