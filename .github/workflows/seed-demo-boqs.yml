# ═══════════════════════════════════════════════════════════════
#  PanelOS — manual demo-BOQ seed (manual only)
#  Runs `php artisan demo:seed-boqs` on the production container via
#  the same SSH path deploy.yml uses. Never triggers automatically.
# ═══════════════════════════════════════════════════════════════

name: Seed Demo BOQs

on:
  workflow_dispatch:
    inputs:
      company_email:
        required: true
      count:
        required: false
        default: "5"

jobs:
  seed:
    name: Create rate-less demo BOQs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment:
      name: production
    steps:
      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          name: panelos_deploy
          known_hosts: unnecessary
          if_key_exists: replace

      - name: Trust server host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
          chmod 644 ~/.ssh/known_hosts

      - name: Run demo:seed-boqs on the server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          COMPANY_EMAIL: ${{ inputs.company_email }}
          COUNT: ${{ inputs.count }}
        run: |
          ssh -i ~/.ssh/panelos_deploy \
              -o StrictHostKeyChecking=accept-new \
              "$DEPLOY_USER@$DEPLOY_HOST" \
              "docker exec -u panelos panelos_backend php artisan demo:seed-boqs --company-email='$COMPANY_EMAIL' --count='$COUNT'"
