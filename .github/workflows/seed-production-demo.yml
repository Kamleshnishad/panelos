# ═══════════════════════════════════════════════════════════════
#  PanelOS — seed a job onto the shop floor (manual only).
#  Runs `php artisan demo:seed-production` on the production container via the
#  same SSH path deploy.yml uses. Never triggers automatically.
#
#  Drives BOQ → quotation → accepted → order → production run → started, then
#  stops with the batch in progress so a person can work the stages, sign them
#  off, run QC, dispatch and invoice by hand.
#
#  NOTE: this creates real records and really deducts stock — it tops material
#  up first so the run can start. Use on demo tenants.
# ═══════════════════════════════════════════════════════════════

name: Seed Production Demo

on:
  workflow_dispatch:
    inputs:
      company_email:
        description: 'Tenant to seed (the company email)'
        required: true
      count:
        description: 'How many jobs to push onto the floor (1-5)'
        required: false
        default: '1'
      no_start:
        description: 'Stop at the order instead of starting the run'
        type: boolean
        required: false
        default: false

jobs:
  seed:
    name: Seed BOQ → production
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment:
      name: production
    steps:
      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          name: panelos_deploy
          known_hosts: unnecessary
          if_key_exists: replace

      - name: Trust server host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
          chmod 644 ~/.ssh/known_hosts

      - name: Run demo:seed-production on the server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          COMPANY_EMAIL: ${{ inputs.company_email }}
          COUNT: ${{ inputs.count }}
          NO_START: ${{ inputs.no_start }}
        run: |
          FLAG=""
          if [ "$NO_START" = "true" ]; then FLAG="--no-start"; fi
          ssh -i ~/.ssh/panelos_deploy \
              -o StrictHostKeyChecking=accept-new \
              "$DEPLOY_USER@$DEPLOY_HOST" \
              "docker exec -u panelos panelos_backend php artisan demo:seed-production --company-email='$COMPANY_EMAIL' --count='$COUNT' $FLAG"
