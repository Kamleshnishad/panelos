# ═══════════════════════════════════════════════════════════════
#  PanelOS — one-time manual check of the storage:link symlink on
#  production (debugging the broken-logo-image report). Never runs
#  automatically; safe to delete once the symlink fix is confirmed.
# ═══════════════════════════════════════════════════════════════

name: Check Storage Link

on:
  workflow_dispatch:

jobs:
  check:
    name: Inspect public/storage symlink + a known file
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment:
      name: production
    steps:
      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          name: panelos_deploy
          known_hosts: unnecessary
          if_key_exists: replace

      - name: Trust server host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
          chmod 644 ~/.ssh/known_hosts

      - name: Check the new /api/storage route from inside and outside the container
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/panelos_deploy \
              -o StrictHostKeyChecking=accept-new \
              "$DEPLOY_USER@$DEPLOY_HOST" \
              "F='logos/6/w4Z2R89xEEnoDcXkA5sAFhq6rzGV00xI1urpp2Nc.png'; echo ---exists---; docker exec panelos_backend php artisan tinker --execute=\"echo 'exists=' . ((int) \\Illuminate\\Support\\Facades\\Storage::disk('public')->exists('$F')) . PHP_EOL; echo 'url=' . \\Illuminate\\Support\\Facades\\Storage::disk('public')->url('$F') . PHP_EOL;\"; echo ---curl-localhost-new-file---; docker exec panelos_backend curl -s -o /dev/null -w 'status=%{http_code}\n' \"http://localhost:8080/api/storage/\$F\"; echo ---curl-localhost-new-file-body---; docker exec panelos_backend curl -s \"http://localhost:8080/api/storage/\$F\" | head -c 500; echo; echo ---route-cache-check---; docker exec panelos_backend ls -la bootstrap/cache/ | grep -i route; echo ---nginx-conf-live---; docker exec panelos_backend cat /etc/nginx/http.d/default.conf | grep -A3 'location \^~'"
