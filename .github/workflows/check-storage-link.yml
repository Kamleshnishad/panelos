# ═══════════════════════════════════════════════════════════════
#  PanelOS — one-time manual check of the storage:link symlink on
#  production (debugging the broken-logo-image report). Never runs
#  automatically; safe to delete once the symlink fix is confirmed.
# ═══════════════════════════════════════════════════════════════

name: Check Storage Link

on:
  workflow_dispatch:

jobs:
  check:
    name: Inspect public/storage symlink + a known file
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment:
      name: production
    steps:
      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          name: panelos_deploy
          known_hosts: unnecessary
          if_key_exists: replace

      - name: Trust server host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
          chmod 644 ~/.ssh/known_hosts

      - name: Check the new /api/storage route from inside and outside the container
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/panelos_deploy \
              -o StrictHostKeyChecking=accept-new \
              "$DEPLOY_USER@$DEPLOY_HOST" \
              "echo ---find-file---; docker exec panelos_backend find /var/www/html/storage/app/public/logos -type f; echo ---disk-path---; docker exec panelos_backend php artisan tinker --execute=\"echo 'path=' . \\Illuminate\\Support\\Facades\\Storage::disk('public')->path('logos/6/1USRq1e8UFwgnMkAMsyV3Z5hSeCJqVTR3vyh6zps.png') . PHP_EOL; echo 'root-config=' . config('filesystems.disks.public.root') . PHP_EOL; echo 'exists=' . ((int) \\Illuminate\\Support\\Facades\\Storage::disk('public')->exists('logos/6/1USRq1e8UFwgnMkAMsyV3Z5hSeCJqVTR3vyh6zps.png')) . PHP_EOL;\""
