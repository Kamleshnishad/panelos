# ═══════════════════════════════════════════════════════════════
#  PanelOS — one-time manual check of the storage:link symlink on
#  production (debugging the broken-logo-image report). Never runs
#  automatically; safe to delete once the symlink fix is confirmed.
# ═══════════════════════════════════════════════════════════════

name: Check Storage Link

on:
  workflow_dispatch:

jobs:
  check:
    name: Inspect public/storage symlink + a known file
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment:
      name: production
    steps:
      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          name: panelos_deploy
          known_hosts: unnecessary
          if_key_exists: replace

      - name: Trust server host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
          chmod 644 ~/.ssh/known_hosts

      - name: Check the new /api/storage route from inside and outside the container
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/panelos_deploy \
              -o StrictHostKeyChecking=accept-new \
              "$DEPLOY_USER@$DEPLOY_HOST" \
              "echo ---image-deployed-at---; docker inspect panelos_backend --format '{{.Created}}'; echo ---route-list---; docker exec panelos_backend php artisan route:list --path=storage; echo ---curl-localhost-api-storage---; docker exec panelos_backend curl -s -o /dev/null -w 'status=%{http_code}\n' http://localhost:8080/api/storage/logos/6/1USRq1e8UFwgnMkAMsyV3Z5hSeCJqVTR3vyh6zps.png; echo ---curl-localhost-api-storage-verbose---; docker exec panelos_backend curl -s http://localhost:8080/api/storage/logos/6/1USRq1e8UFwgnMkAMsyV3Z5hSeCJqVTR3vyh6zps.png -o /dev/null -D -; echo ---host-curl-domain---; curl -s -o /dev/null -w 'status=%{http_code}\n' https://pufpanel.digitalwebweaver.com/api/storage/logos/6/1USRq1e8UFwgnMkAMsyV3Z5hSeCJqVTR3vyh6zps.png"
