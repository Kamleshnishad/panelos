# ═══════════════════════════════════════════════════════════════
#  PanelOS — uptime monitor (EN-04).
#  Every 10 minutes: is the site up, and does /api/health say the database
#  and the task scheduler are alive (and the app is not throwing a spike of 500s)?
#  A failed run is how you find out: GitHub e-mails the repo owner on a failed
#  scheduled workflow (Settings -> Notifications -> Actions, on by default).
#  Retries 3x, 20s apart, so a deploy restart or a network blip is not an alarm.
#  Scheduled runs only fire from the default branch, and GitHub pauses them
#  after 60 days without repo activity — any push re-enables them.
# ═══════════════════════════════════════════════════════════════

name: Uptime

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  probe:
    name: Probe production
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      SITE: https://pufpanel.digitalwebweaver.com
    steps:
      - name: /up and /api/health
        run: |
          for attempt in 1 2 3; do
            up=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$SITE/up" || true)
            code=$(curl -s -o health.json -w '%{http_code}' --max-time 15 "$SITE/api/health" || true)
            echo "attempt $attempt: /up=$up /api/health=$code"
            [ -s health.json ] && cat health.json && echo
            if [ "$up" = "200" ] && [ "$code" = "200" ]; then
              echo "::notice::healthy"
              exit 0
            fi
            [ "$attempt" -lt 3 ] && sleep 20
          done
          echo "::error::PanelOS is down or degraded (see the health JSON above)"
          exit 1
